<style>
/* Layout: status bar with crowns, a fixed live preview of your player banner with its action button, category switch, then a scrolling area: weekly prize ladder and the item grid. */
:root {
  --felt: #0f4c3c;
  --felt-deep: #062a21;
  --felt-line: rgba(216, 178, 106, .32);
  --brass: #d8b26a;
  --brass-ink: #2a1f0c;
  --ink: #f2eee3;
  --muted: rgba(242, 238, 227, .62);
  --glass: rgba(4, 22, 17, .55);
  --win: #7fd99a;
  --lose: #ff8a7a;
  --gold: #e9c46a;
  --f-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --f-ui: "Outfit", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
  height: 100%;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 10%, var(--felt) 0%, #0b3d30 45%, var(--felt-deep) 100%) fixed, var(--felt-deep);
  color: var(--ink); font-family: var(--f-ui); overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
.app {
  height: 100%; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 10px; max-width: 560px; margin: 0 auto;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bank { display: flex; flex-direction: column; }
.label, .bank small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.bank strong { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--gold); display: inline-flex; align-items: center; gap: 4px; }
.bank strong .crown-ico { width: 18px; height: 18px; }

.preview { display: flex; flex-direction: column; gap: 10px; flex: none; }
.preview .pcard { min-height: 84px; transition: transform .25s; }
.preview .pcard.swap { animation: swap .35s cubic-bezier(.2,.8,.25,1); }
@keyframes swap { from { transform: scale(.97); opacity: .6; } }
.action { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.action .what { min-width: 0; }
.action .what b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action .what span { font-size: 13px; color: var(--muted); }
.btn { height: 46px; border-radius: 14px; font-weight: 600; font-size: 15.5px; background: var(--glass); border: 1px solid var(--felt-line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.btn.primary { color: var(--brass-ink); border-color: var(--brass); }
.msg { min-height: 18px; font-size: 14px; color: var(--lose); }
.msg.ok { color: var(--win); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 12px; background: rgba(0,0,0,.25); border: 1px solid var(--felt-line); flex: none; }
.seg button { height: 34px; border-radius: 9px; font-weight: 600; font-size: 14.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; margin-inline: -4px; padding-inline: 4px; }

.week { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: linear-gradient(150deg, rgba(216,178,106,.2), rgba(4,22,17,.6) 60%); border: 1px solid var(--felt-line); }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.week h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.countdown { font-size: 13px; color: var(--brass); font-weight: 600; font-variant-numeric: tabular-nums; }
.myweek { font-size: 14px; color: var(--muted); line-height: 1.4; }
.myweek b { color: var(--ink); }
.ladder { display: flex; flex-direction: column; gap: 4px; }
.step { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 10px; background: rgba(0,0,0,.2); font-size: 14px; }
.step.me { background: rgba(216,178,106,.2); box-shadow: inset 0 0 0 1px var(--brass); }
.step .r { font-weight: 600; }
.step .r small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.step .c { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; gap: 3px; align-items: center; }
.week .note { font-size: 12.5px; color: var(--muted); margin: 0; }
.week a { color: var(--brass); font-size: 14px; font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.item { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 16px; background: var(--glass); border: 1.5px solid transparent; text-align: left; min-width: 0; }
.item[aria-pressed="true"] { border-color: var(--brass); background: rgba(216,178,106,.1); }
.item .sw { position: relative; height: 62px; border-radius: 11px; overflow: hidden; display: grid; place-items: center; }
.item .sw.frame-sw, .item .sw.title-sw { background: radial-gradient(circle at 50% 40%, #13604b, #062a21); }
.item .sw .av { width: 34px; height: 34px; font-size: 15px; }
.item .sw .ttl { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #f1dfb0; padding: 0 8px; text-align: center; }
.item .sw .ttl.gold { color: var(--gold); }
.item .nm { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline: 2px; }
.item .st { font-size: 12.5px; font-weight: 600; padding-inline: 2px; display: inline-flex; align-items: center; gap: 3px; color: var(--gold); }
.item .st.owned { color: var(--muted); }
.item .st.on { color: var(--win); }
.item .st.excl { color: #f3c9a4; }
.badge { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 8px; background: rgba(0,0,0,.55); color: var(--gold); }
.empty { text-align: center; color: var(--muted); padding: 10px; font-size: 14px; }
.daily .ch { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.22); }
.daily .ch + .ch { margin-top: 6px; }
.daily .ch .lb { font-size: 14px; font-weight: 600; line-height: 1.3; }
.daily .ch .cr { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.daily .ch .bar2 { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.daily .ch .bar2 i { display: block; height: 100%; background: linear-gradient(90deg, #e6c483, var(--brass)); border-radius: 4px; transition: width .6s cubic-bezier(.2,.8,.25,1); }
.daily .ch .pg { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -2px; }
.daily .ch.ok { background: rgba(127,217,154,.12); box-shadow: inset 0 0 0 1px rgba(127,217,154,.4); }
.daily .ch.ok .cr { color: var(--win); }
.daily .ch.bonus { background: linear-gradient(90deg, rgba(233,196,106,.22), rgba(0,0,0,.2)); }
.dl-login { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.dl-login b { font-size: 15px; }
.shophead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.shophead b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.shophead span { font-size: 13px; color: var(--brass); font-weight: 600; }
.item .rar { padding-inline: 2px; }
.tierprev { display: grid; grid-template-columns: 1fr; gap: 6px; }
.tierprev .pcard { min-height: 56px; padding: 10px 12px; }
.tierprev .pcard .av.lg { width: 40px; height: 40px; font-size: 17px; }
.tierprev .pcard b { font-size: 15px; }
.step .tier { height: 22px; font-size: 11.5px; }
.step.champ { background: linear-gradient(90deg, rgba(233,196,106,.25), rgba(0,0,0,.2)); }
#seasonMe .ps-box { background: rgba(0,0,0,.22); }
</style>

<body>
<div class="app">
  <header class="bar">
    <div class="bank"><small>Couronnes</small><strong><span id="bank">—</span></strong></div>
    <nav class="switch"></nav>
  </header>

  <section class="preview" aria-label="Aperçu">
    <div id="card"></div>
    <div class="action">
      <div class="what"><b id="selName">Ta bannière</b><span id="selInfo">Touche un objet pour l'essayer.</span></div>
      <button class="btn primary" id="actBtn" hidden>Équiper</button>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <div class="seg" role="group" aria-label="Catégorie" style="position:relative">
    <button data-k="banner" aria-pressed="true">Bannières</button>
    <button data-k="frame" aria-pressed="false">Cadres</button>
    <button data-k="title" aria-pressed="false">Titres</button>
  </div>

  <div class="scroll">
    <div class="shophead"><b>Sélection de la semaine</b><span id="shopEnd"></span></div>
    <div class="grid" id="grid"></div>


  </div>
</div>
<script src="app.js"></script>
<script>
(() => {
  const A = window.CasinoAccount, UI = window.CasinoUI;
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: 0 });
  document.querySelector(".bank strong").insertAdjacentHTML("afterbegin", UI.CROWN);

  let kind = "banner", selected = null, busy = false;
  const P = () => A.profile || { crowns: 0, banner: "tapis", frame: "aucun", title: "sans-titre", owned: [] };
  const owned = id => A.ITEM[id].price === 0 || (P().owned || []).includes(id);
  const equipped = id => P()[A.ITEM[id].kind] === id;

  function say(t, ok) { $("msg").className = "msg" + (ok ? " ok" : ""); $("msg").textContent = t || ""; }

  function renderCard(animate) {
    const p = P(), s = selected && A.ITEM[selected];
    const look = { banner: p.banner, frame: p.frame, title: p.title };
    if (s) look[s.kind] = s.id;
    const name = A.session ? A.session.username : "Toi";
    $("card").innerHTML = UI.cardHTML({ name, ...look, avatar: A.profile && A.profile.avatar_url, sub: s ? "Aperçu" : A.session ? "Ta bannière actuelle" : "Connecte-toi pour personnaliser" });
    if (animate) { const c = $("card").firstElementChild; c.classList.add("swap"); }
  }

  function renderAction() {
    const btn = $("actBtn"), s = selected && A.ITEM[selected];
    btn.hidden = !s;
    if (!s) { $("selName").textContent = "Ta bannière"; $("selInfo").textContent = "Touche un objet pour l'essayer."; return; }
    $("selName").textContent = s.name;
    btn.disabled = busy;
    btn.className = "btn primary";
    if (!A.configured() || !A.session) {
      $("selInfo").textContent = s.price === null ? `Exclusif · ${s.how}` : s.price ? `${fmt(s.price)} couronnes` : "Gratuit";
      btn.textContent = "Se connecter";
      return;
    }
    if (equipped(s.id)) { $("selInfo").textContent = "Équipé"; btn.textContent = "Équipé"; btn.disabled = true; btn.className = "btn"; }
    else if (owned(s.id)) { $("selInfo").textContent = s.price ? "Dans ta collection" : "Gratuit"; btn.textContent = "Équiper"; }
    else if (s.price === null) { $("selInfo").textContent = `Exclusif · récompense du ${s.how}`; btn.textContent = "Exclusif"; btn.disabled = true; btn.className = "btn"; }
    else {
      const enough = P().crowns >= s.price;
      $("selInfo").textContent = enough ? `Il te restera ${fmt(P().crowns - s.price)} couronnes` : `Il te manque ${fmt(s.price - P().crowns)} couronnes`;
      btn.innerHTML = `Acheter · ${fmt(s.price)} ${UI.CROWN}`;
      btn.disabled = busy || !enough;
    }
  }

  function swatch(it) {
    const p = P(), name = A.session ? A.session.username : "Toi";
    const photo = A.profile && A.profile.avatar_url;
    if (it.kind === "banner") return `<div class="sw bn-${it.id}">${UI.avatarHTML(name, p.frame, "md", photo)}</div>`;
    if (it.kind === "frame") return `<div class="sw frame-sw">${UI.avatarHTML(name, it.id, "md", photo)}</div>`;
    return `<div class="sw title-sw"><span class="ttl${it.price === null ? " gold" : ""}">${it.id === "sans-titre" ? "—" : UI.esc(it.name)}</span></div>`;
  }
  function status(it) {
    if (A.session && equipped(it.id)) return `<span class="st on">Équipé</span>`;
    if (A.session && owned(it.id) && it.price !== 0) return `<span class="st owned">Possédé</span>`;
    if (it.price === 0) return `<span class="st owned">Gratuit</span>`;
    if (it.price === null) return `<span class="st excl">Exclusif</span>`;
    return `<span class="st">${UI.CROWN}${fmt(it.price)}</span>`;
  }
  // this week's selection (same draw as the server); offline we keep the last one we saw
  let week = null, stats = null;
  try { week = JSON.parse(localStorage.getItem("casino.shopweek") || "null"); } catch (e) {}
  function rarityLine(it) {
    if (!stats || it.price === 0) return "";
    const r = UI.rarity(stats.holders[it.id] || 0, stats.players);
    return r ? `<span class="rar rar-${r.key}" title="${r.holders} joueur${r.holders > 1 ? "s" : ""} sur ${r.players}">${r.label} · ${r.holders} joueur${r.holders > 1 ? "s" : ""}</span>` : "";
  }
  function renderGrid() {
    if (!week) { $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${A.configured() && A.session ? "Chargement de la sélection de la semaine…" : "Connecte-toi dans l'onglet Classement pour voir la sélection de la semaine."}</div>`; return; }
    const items = week.items.map(id => A.ITEM[id]).filter(it => it && it.kind === kind);
    $("grid").innerHTML = items.map((it, i) => `<button class="item rise" style="--i:${i}" data-id="${it.id}" aria-pressed="${selected === it.id}">
      ${swatch(it)}<span class="nm">${UI.esc(it.name)}</span>${status(it)}${rarityLine(it)}</button>`).join("") ||
      `<div class="empty" style="grid-column:1/-1">Rien dans cette catégorie cette semaine.</div>`;
  }
  async function loadShop() {
    if (!A.configured() || !A.session) return;
    try {
      const [w, st] = await Promise.all([A.shopWeek(), A.itemStats().catch(() => null)]);
      week = w; stats = st;
      try { localStorage.setItem("casino.shopweek", JSON.stringify(w)); } catch (e) {}
      renderGrid(); tickShop();
    } catch (e) {
      if (!week) $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${UI.esc(/shop_week/.test(e.raw || "") ? "La boutique tournante arrive avec la mise à jour du serveur." : e.code === "network" ? "Il faut internet pour voir la boutique." : e.message)}</div>`;
    }
  }
  function nextMonday() {
    const d = new Date(); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
    return d;
  }
  function tickShop() {
    const el = $("shopEnd"); if (!el) return;
    const end = week && week.week_end ? new Date(week.week_end) : nextMonday();
    const ms = end - Date.now(), d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24;
    el.textContent = ms > 0 ? `Nouvelle sélection dans ${d ? d + " j " : ""}${h} h` : "Nouvelle sélection en cours";
  }
  function render(animate) {
    $("bank").textContent = A.session && A.profile ? fmt(A.profile.crowns) : "—";
    renderCard(animate); renderAction(); renderGrid();
  }

  $("grid").addEventListener("click", e => {
    const b = e.target.closest(".item"); if (!b) return;
    selected = selected === b.dataset.id ? null : b.dataset.id;
    say("");
    renderCard(true); renderAction();
    $("grid").querySelectorAll(".item").forEach(x => { x.setAttribute("aria-pressed", String(x.dataset.id === selected)); x.classList.remove("rise"); });
  });
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderGrid();
  });
  $("actBtn").onclick = async () => {
    const s = selected && A.ITEM[selected];
    if (!s || busy) return;
    if (!A.session) { location.href = "classement.html"; return; }
    busy = true; renderAction(); say("");
    try {
      if (!owned(s.id)) { await A.buy(s.id); say(`${s.name} rejoint ta collection.`, true); }
      await A.equip(s.id);
      if (!$("msg").textContent) say(`${s.name} équipé.`, true);
      selected = null;
      render(true);
    } catch (err) { say(err.message); }
    busy = false; renderAction();
  };

  // weekly prizes
  A.onChange(() => render(false));
  render(false);
  loadShop(); setInterval(tickShop, 60000);

  if (A.configured() && A.session) A.loadProfile().then(() => { render(false); }).catch(err => say(err.raw && /my_profile/.test(err.raw) ? "Le serveur n'a pas encore la mise à jour de la boutique." : ""));
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
